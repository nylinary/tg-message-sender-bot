# Defaults only. The deadline, interval, jitter and timezone can all be changed
# from the bot (⚙️ Настройки); values set there are stored in Postgres and win.

[campaign]
# Local wall-clock time in `timezone`. After it passes, sending stops.
deadline = "2026-09-25T21:00:00"
timezone = "Europe/Moscow"

[pacing]
# Seconds between two messages, and how much each gap is randomised (±35%).
interval     = 180
jitter       = 0.35
# Nobody can set the interval below this; Telegram answers FLOOD_WAIT anyway.
min_interval = 10

# Night hours, local to `timezone`, and what happens during them:
#   "silent" — keep sending, but the notification arrives without sound
#   "pause"  — send nothing until morning
# Changeable from the bot (⚙️ Настройки).
quiet_start = 23
quiet_end   = 10
night_mode  = "silent"

# An extra pause after every N messages.
long_pause_every = 60
long_pause_min   = 90
long_pause_max   = 240

# Multiply later gaps by this after each FLOOD_WAIT, up to the cap.
flood_backoff     = 1.5
flood_backoff_max = 8.0

[spamcheck]
# Ask @SpamBot about the account every N hours (0 = only when you press the
# button). notify: "always" reports every check, "problems" only when limited.
# Both changeable from the bot.
every_hours = 6
notify      = "always"

[risk]
# Messages per day above which the panel warns. Advisory only.
warn_per_day   = 300
danger_per_day = 600

[collect]
# Re-scan dialogues automatically if the cached list is older than this.
stale_after_hours = 6

[files]
state_dir = "state"
